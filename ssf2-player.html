<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b10">
<title>Super Smash Flash 2 · VEYΛORA</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#eaf1ff;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column}
.top{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#101620;border-bottom:1px solid #263142;font-size:12px;letter-spacing:.12em}
.brand{font-weight:800}.brand span{color:#51caff}.state{color:#9aa9bd;font-size:10px;text-align:right}
#stage{position:relative;flex:1;min-height:0;width:100%;overflow:hidden;background:#080b10}
#official-player{position:absolute;inset:0;width:100%;height:100%;border:0;background:#080b10}
#notice{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;display:none;padding:12px 14px;border:1px solid #263142;border-radius:10px;background:#101620ed;font-size:13px;line-height:1.45}
#notice a{color:#51caff}
</style>
</head>
<body>
<header class="top"><span class="brand">VEYΛORA <span>/</span> SSF2</span><span class="state" id="status">OPENING OFFICIAL RUFFLE PLAYER</span></header>
<main id="stage" aria-label="Embedded Super Smash Flash 2 player">
  <iframe id="official-player" title="Super Smash Flash 2 Ruffle player" src="https://www.supersmashflash.com/play/ssf2/?ruffle=true" allow="fullscreen; autoplay" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div id="notice">If the game area stays blank, the official site may block embedding in other websites. <a href="https://www.supersmashflash.com/play/ssf2/" target="_blank" rel="noopener noreferrer">Open the official SSF2 page</a>.</div>
</main>
<script>
const frame=document.getElementById("official-player");
const status=document.getElementById("status");
frame.addEventListener("load",()=>{status.textContent="OFFICIAL PLAYER LOADED";});
frame.addEventListener("error",()=>{status.textContent="PLAYER EMBED BLOCKED";document.getElementById("notice").style.display="block";});
setTimeout(()=>{if(status.textContent==="OPENING OFFICIAL RUFFLE PLAYER"){status.textContent="WAITING FOR GAME";document.getElementById("notice").style.display="block";}},12000);
</script>
</body>
</html>
