name: Experimental original Xbox WebAssembly build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-xemu-wasm.yml"

permissions:
  contents: read

jobs:
  probe-xemu-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out VEYAORA Arcade
        uses: actions/checkout@v4

      - name: Check out xemu source
        uses: actions/checkout@v4
        with:
          repository: xemu-project/xemu
          path: _work/xemu
          submodules: recursive

      - name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.50
          actions-cache-folder: emsdk-cache

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3-pip             libglib2.0-dev libpixman-1-dev libepoxy-dev libgtk-3-dev             libssl-dev libsamplerate0-dev libslirp-dev
          python3 -m pip install --break-system-packages meson tomli

      - name: Verify upstream Emscripten configuration exists
        working-directory: _work/xemu
        run: |
          test -f configs/meson/emscripten.txt
          test -f os-wasm.c
          test -f util/coroutine-wasm.c
          echo "Upstream contains Emscripten support code."
          emcc --version

      - name: Attempt original Xbox target configuration
        working-directory: _work/xemu
        env:
          CC: emcc
          CXX: em++
          AR: emar
          RANLIB: emranlib
          CFLAGS: "-O2 -pthread -DWASM_BIGINT"
          CXXFLAGS: "-O2 -pthread -DWASM_BIGINT"
          LDFLAGS: "-pthread -sWASM_BIGINT -sASYNCIFY=1 -sALLOW_TABLE_GROWTH -sTOTAL_MEMORY=2GB"
        run: |
          set -o pipefail
          emconfigure ./configure \
            --target-list=i386-softmmu \
            --disable-werror \
            --disable-gtk \
            --disable-vnc \
            --disable-curl \
            --disable-slirp \
            --disable-docs \
            --disable-tools 2>&1 | tee ../../xemu-wasm-configure.log

      - name: Compile probe
        working-directory: _work/xemu
        run: |
          set -o pipefail
          emmake make -j2 2>&1 | tee ../../xemu-wasm-build.log

      - name: Preserve build logs even if the probe fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xemu-wasm-build-logs
          path: |
            xemu-wasm-configure.log
            xemu-wasm-build.log
          if-no-files-found: ignore
          retention-days: 14
