name: Build New Game for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "games/new-game/**"
      - "main.js"
      - "package.json"
      - ".github/workflows/build-new-game-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository and download Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build portable Windows EXE
        run: npm run dist:win

      - name: Publish portable EXE for the website
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No EXE was produced in dist." }

          $target = Join-Path $exe.DirectoryName "New Game.exe"
          if ($exe.FullName -ne $target) {
            Move-Item -LiteralPath $exe.FullName -Destination $target -Force
          }

          gh release view new-game-latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload new-game-latest "$target" --clobber
          } else {
            gh release create new-game-latest "$target" --title "New Game - Latest" --notes "Latest portable Windows build of New Game from VEYΛORA Arcade."
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the Windows EXE failed." }

      - name: Keep a workflow artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: New-Game-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
