name: Build New Game for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "games/new-game/**"
      - "main.js"
      - "package.json"
      - ".github/workflows/build-new-game-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository and download Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build portable Windows EXE
        run: npm run dist:win

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: New-Game-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
